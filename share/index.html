<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared Chinese Name | Hànzi</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/culture.css"></head><body><main class="culture-main share-page"><section class="culture-hero"><p class="culture-kicker">A name worth carrying</p><div id="shared-card" class="shared-card" aria-live="polite"></div><p><a href="/">Create your own Chinese name ↗</a></p></section></main><script src="/share-card.js"></script><script>(function(){try{var item=HanziShareCard.decode(location.hash);var host=document.querySelector('#shared-card');[['p',item.kind],['h1',item.name],['p',item.pinyin],['p',item.meaning]].forEach(function(pair){var el=document.createElement(pair[0]);el.textContent=pair[1];host.appendChild(el)});var btn=document.createElement('button');btn.textContent='Download or share this card';btn.onclick=function(){HanziShareCard.open(item)};host.appendChild(btn)}catch(e){document.querySelector('#shared-card').innerHTML='<h1>This name card is unavailable.</h1><p><a href="/">Create a new one ↗</a></p>'}})();</script></body></html>
